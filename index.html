<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprintbook</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#1b2433;--muted:#64708a;--line:#d9dfea;--accent:#2f5bea;--accent-ink:#fff;--ok:#1f8a5b;--warn:#b97a0c;--bad:#c8402f;--col:#e4e9f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--surface:#1b2230;--ink:#e6ebf5;--muted:#8d99b3;--line:#2b3447;--accent:#6f93ff;--accent-ink:#0d1320;--ok:#4cc38a;--warn:#e0a53a;--bad:#ef7765;--col:#161c29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121722;--surface:#1b2230;--ink:#e6ebf5;--muted:#8d99b3;--line:#2b3447;--accent:#6f93ff;--accent-ink:#0d1320;--ok:#4cc38a;--warn:#e0a53a;--bad:#ef7765;--col:#161c29;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-size:26px;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sprintbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:grid;gap:10px}
.sprintbar .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.bar{height:10px;background:var(--col);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--col);border-radius:12px;padding:10px;min-height:240px}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:15px;display:flex;justify-content:space-between;padding:2px 4px 10px}
.col h3 span{color:var(--muted);font-weight:500;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:grab}
.card.p-alta{border-left-color:var(--bad)}.card.p-media{border-left-color:var(--warn)}.card.p-baixa{border-left-color:var(--ok)}
.card .t{font-weight:500;cursor:pointer;word-break:break-word}
.card .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:12.5px;gap:6px}
.chip{background:var(--col);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--muted)}
.mv{border:1px solid var(--line);background:none;border-radius:6px;width:26px;height:24px;padding:0;line-height:1}
.empty{color:var(--muted);padding:18px 6px;text-align:center;font-size:14px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item .t{font-weight:500;cursor:pointer}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:17px;margin-bottom:8px}
label{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:90px;resize:vertical}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(10,15,25,.55)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.h-sprint{margin:0 0 6px;font-size:18px}
.muted{color:var(--muted)}
dialog{max-height:90vh;overflow:auto}
.att{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px}
.att img{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block;cursor:zoom-in}
.att .nm{flex:1;min-width:0;font-size:13.5px}.att .nm a{color:var(--accent);word-break:break-all}
.att .ic{width:44px;text-align:center;font-size:24px}
.drop{border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;color:var(--muted);font-size:13.5px}
.drop.over{border-color:var(--accent);background:var(--col)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Sprintbook</h1>
    <div class="row">
      <button class="btn" id="themeBtn" type="button"></button>
      <select id="sprintSel" aria-label="Sprint atual" style="width:auto"></select>
      <button class="btn" id="newSprint">Nova sprint</button>
      <button class="btn pri" id="newTask">Nova task</button>
    </div>
  </header>
  <section class="sprintbar" id="sprintbar"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<dialog id="dTask">
  <h2 id="dTaskTitle">Nova task</h2>
  <label for="fTitle">Título</label><input id="fTitle">
  <label for="fDesc">Descrição</label><textarea id="fDesc"></textarea>
  <div class="two">
    <div><label for="fPrio">Prioridade</label><select id="fPrio"><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select></div>
    <div><label for="fPts">Pontos</label><select id="fPts"></select></div>
    <div><label for="fTag">Etiqueta</label><input id="fTag" placeholder="ex: backend, bug"></div>
    <div><label for="fStatus">Status</label><select id="fStatus"></select></div>
  </div>
  <label for="fSprint">Sprint</label><select id="fSprint"></select>
  <label>Anexos</label>
  <div class="drop" id="dropZone"><button class="btn" id="pickFile" type="button">Adicionar arquivo</button><div style="margin-top:6px">ou arraste aqui, ou cole um print com Ctrl+V</div></div>
  <input type="file" id="fileIn" multiple hidden>
  <div id="attList"></div>
  <div class="row" style="margin-top:18px;justify-content:space-between">
    <button class="btn danger" id="delTask">Excluir</button>
    <div class="row"><button class="btn" id="cancelTask">Cancelar</button><button class="btn pri" id="saveTask">Salvar task</button></div>
  </div>
</dialog>

<dialog id="dSprint">
  <h2>Nova sprint</h2>
  <label for="sName">Nome</label><input id="sName" placeholder="Sprint 12">
  <label for="sGoal">Objetivo</label><textarea id="sGoal" style="min-height:60px"></textarea>
  <div class="two">
    <div><label for="sStart">Início</label><input type="date" id="sStart"></div>
    <div><label for="sEnd">Fim</label><input type="date" id="sEnd"></div>
  </div>
  <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" id="cancelSprint">Cancelar</button><button class="btn pri" id="saveSprint">Criar sprint</button></div>
</dialog>

<dialog id="dImg" style="width:min(900px,95vw)"><img id="bigImg" alt="" style="max-width:100%;display:block;margin:0 auto"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="closeImg">Fechar</button></div></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return fmt(d)};
const today=()=>fmt(new Date());
const br=s=>s?s.split('-').reverse().join('/'):'';
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='sprintbook:v1';
const COLS=[['todo','A fazer'],['doing','Em andamento'],['review','Em review'],['done','Feito']];
const PRIO={alta:'Alta',media:'Média',baixa:'Baixa'};
const TABS=[['board','Board'],['backlog','Backlog'],['daily','Daily'],['hist','Histórico']];

function seed(){
  const t=today(),s={id:'s1',name:'Sprint 1',goal:'Entregar o fluxo de login e o painel inicial',start:addDays(t,-4),end:addDays(t,9),closed:false};
  const mk=(title,status,prio,pts,tag,sprint='s1')=>({id:uid(),title,desc:'',status,prio,pts,tag,sprint,created:addDays(t,-4),done_at:status==='done'?addDays(t,-1):null});
  return {sprints:[s],cur:'s1',view:'board',tasks:[
    mk('Configurar pipeline de CI','done','media',3,'devops'),
    mk('Tela de login com validação','doing','alta',5,'frontend'),
    mk('Endpoint de recuperação de senha','todo','alta',5,'backend'),
    mk('Revisar PR do módulo de relatórios','review','media',2,'review'),
    mk('Corrigir bug no filtro de datas','todo','baixa',1,'bug'),
    mk('Pesquisar biblioteca de gráficos','todo','baixa',2,'spike','')
  ],dailies:{},dDate:t};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.sprints)S=seed();
S.dDate=today();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const sprint=id=>S.sprints.find(x=>x.id===id);
const curTasks=()=>S.tasks.filter(t=>t.sprint===S.cur);

function renderHead(){
  const sel=$('#sprintSel');
  sel.innerHTML=S.sprints.map(s=>`<option value="${s.id}" ${s.id===S.cur?'selected':''}>${esc(s.name)}${s.closed?' (encerrada)':''}</option>`).join('');
  const sp=sprint(S.cur),bar=$('#sprintbar');
  if(!sp){bar.innerHTML='<div class="empty">Crie uma sprint para começar a organizar suas tasks.</div>';return}
  const ts=curTasks(),tot=ts.reduce((a,t)=>a+t.pts,0);
  const by=k=>ts.filter(t=>t.status===k).reduce((a,t)=>a+t.pts,0);
  const done=by('done'),pct=tot?Math.round(done/tot*100):0;
  const left=Math.ceil((new Date(sp.end+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
  const dayTxt=sp.closed?'Sprint encerrada':left>=0?`${left} dia${left===1?'':'s'} restante${left===1?'':'s'}`:`Atrasada ${-left} dia${left===-1?'':'s'}`;
  bar.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2 style="font-size:19px">${esc(sp.name)}</h2><div class="muted">${esc(sp.goal||'Sem objetivo definido')}</div></div>
  ${sp.closed?'':'<button class="btn" id="closeSprint">Encerrar sprint</button>'}</div>
  <div class="bar" title="${pct}% concluído"><i style="width:${tot?by('done')/tot*100:0}%;background:var(--ok)"></i><i style="width:${tot?by('review')/tot*100:0}%;background:var(--warn)"></i><i style="width:${tot?by('doing')/tot*100:0}%;background:var(--accent)"></i></div>
  <div class="meta"><span><b>${done}</b> de ${tot} pontos (${pct}%)</span><span>${ts.filter(t=>t.status==='done').length}/${ts.length} tasks</span><span>${br(sp.start)} a ${br(sp.end)}</span><span>${dayTxt}</span></div>`;
  const c=$('#closeSprint');if(c)c.onclick=closeSprint;
}
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.view===k}" data-v="${k}">${l}</button>`).join('');
}
function card(t){
  return `<div class="card p-${t.prio}" draggable="true" data-id="${t.id}">
  <div class="t" data-edit="${t.id}">${esc(t.title)}</div>
  <div class="m"><span>${t.tag?`<span class="chip">${esc(t.tag)}</span> `:''}${t.pts} pt${t.pts>1?'s':''} · ${PRIO[t.prio]}${(t.atts||[]).length?` · 📎 ${t.atts.length}`:''}</span>
  <span class="row" style="gap:4px"><button class="mv" data-mv="-1" data-id="${t.id}" aria-label="Mover para a coluna anterior">‹</button><button class="mv" data-mv="1" data-id="${t.id}" aria-label="Mover para a próxima coluna">›</button></span></div></div>`;
}
function vBoard(){
  const ts=curTasks();
  if(!sprint(S.cur))return '';
  return `<div class="board">${COLS.map(([k,l])=>{const c=ts.filter(t=>t.status===k);
    return `<div class="col" data-col="${k}"><h3>${l}<span>${c.length}</span></h3>${c.map(card).join('')||'<div class="empty">Arraste uma task para cá</div>'}</div>`}).join('')}</div>`;
}
function vBacklog(){
  const b=S.tasks.filter(t=>!t.sprint);
  const cur=sprint(S.cur);
  return `<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="font-size:20px">Backlog (${b.length})</h2></div>
  <div class="list">${b.map(t=>`<div class="item"><div><div class="t" data-edit="${t.id}">${esc(t.title)}</div><div class="muted" style="font-size:13px">${t.tag?esc(t.tag)+' · ':''}${t.pts} pts · prioridade ${PRIO[t.prio].toLowerCase()}</div></div>
  ${cur&&!cur.closed?`<button class="btn" data-pull="${t.id}">Levar para ${esc(cur.name)}</button>`:''}</div>`).join('')||'<div class="empty">Backlog vazio. Novas ideias e demandas sem sprint aparecem aqui.</div>'}</div>`;
}
function vDaily(){
  const d=S.dDate,y=addDays(d,-1),e=S.dailies[d]||{};
  const doneY=S.tasks.filter(t=>t.done_at===y),doing=S.tasks.filter(t=>t.status==='doing');
  const past=Object.keys(S.dailies).filter(k=>k!==d).sort().reverse().slice(0,6);
  const sug=(arr,target)=>arr.map(t=>`<div class="sug"><span>${esc(t.title)}</span><button class="btn" data-ins="${target}" data-text="${esc(t.title)}">Inserir</button></div>`).join('')||'<div class="muted" style="font-size:14px">Nada por aqui.</div>';
  return `<div class="grid2"><div class="panel"><h3>Daily de ${br(d)}</h3>
  <input type="date" id="dDate" value="${d}" style="width:auto">
  <label for="dY">O que fiz ontem</label><textarea id="dY" data-f="yesterday">${esc(e.yesterday||'')}</textarea>
  <label for="dT">O que vou fazer hoje</label><textarea id="dT" data-f="today">${esc(e.today||'')}</textarea>
  <label for="dB">Bloqueios</label><textarea id="dB" data-f="blockers">${esc(e.blockers||'')}</textarea>
  <div class="muted" style="font-size:13px;margin-top:8px">Salvo automaticamente.</div></div>
  <div style="display:grid;gap:16px;align-content:start"><div class="panel"><h3>Concluídas ontem</h3>${sug(doneY,'dY')}</div>
  <div class="panel"><h3>Em andamento</h3>${sug(doing,'dT')}</div></div></div>
  ${past.length?`<h3 style="margin:22px 0 10px">Dailies anteriores</h3><div class="list">${past.map(k=>{const x=S.dailies[k];return `<div class="panel"><b>${br(k)}</b><div class="muted" style="white-space:pre-wrap;font-size:14px">${esc(x.today||x.yesterday||'(vazio)')}</div>${x.blockers?`<div style="color:var(--bad);font-size:14px;white-space:pre-wrap">Bloqueio: ${esc(x.blockers)}</div>`:''}</div>`}).join('')}</div>`:''}`;
}
function vHist(){
  const done=S.tasks.filter(t=>t.status==='done');
  const groups=[...S.sprints].reverse().map(s=>({s,t:done.filter(t=>t.sprint===s.id)})).concat([{s:{name:'Sem sprint'},t:done.filter(t=>!t.sprint||!sprint(t.sprint))}]).filter(g=>g.t.length);
  if(!groups.length)return '<div class="empty">Nada concluído ainda. Tasks marcadas como Feito aparecem aqui.</div>';
  return groups.map(g=>`<div style="margin-bottom:22px"><h3 class="h-sprint">${esc(g.s.name)} <span class="muted" style="font-size:14px;font-weight:500">${g.t.length} tasks · ${g.t.reduce((a,t)=>a+t.pts,0)} pts</span></h3><div class="list">${g.t.sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||'')).map(t=>`<div class="item"><span class="t" data-edit="${t.id}">${esc(t.title)}</span><span class="muted" style="font-size:13px">${t.tag?esc(t.tag)+' · ':''}${t.pts} pts · feito em ${br(t.done_at)||'—'}</span></div>`).join('')}</div></div>`).join('');
}
function render(){
  renderHead();renderTabs();
  $('#view').innerHTML={board:vBoard,backlog:vBacklog,daily:vDaily,hist:vHist}[S.view]();
  bindView();save();
}

function setStatus(t,st){t.status=st;t.done_at=st==='done'?(t.done_at||today()):null}
function bindView(){
  document.querySelectorAll('.card').forEach(c=>{c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id)});
  document.querySelectorAll('.col').forEach(c=>{
    c.ondragover=e=>{e.preventDefault();c.classList.add('over')};
    c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=e=>{e.preventDefault();const t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){setStatus(t,c.dataset.col);render()}};
  });
  const dd=$('#dDate');if(dd)dd.onchange=()=>{S.dDate=dd.value||today();render()};
  document.querySelectorAll('textarea[data-f]').forEach(a=>a.oninput=()=>{(S.dailies[S.dDate]=S.dailies[S.dDate]||{})[a.dataset.f]=a.value;save()});
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-v],[data-edit],[data-mv],[data-pull],[data-ins]');if(!g)return;
  if(g.dataset.v){S.view=g.dataset.v;render()}
  else if(g.dataset.edit)openTask(g.dataset.edit);
  else if(g.dataset.mv){const t=S.tasks.find(x=>x.id===g.dataset.id),i=COLS.findIndex(c=>c[0]===t.status)+ +g.dataset.mv;if(i>=0&&i<COLS.length){setStatus(t,COLS[i][0]);render()}}
  else if(g.dataset.pull){const t=S.tasks.find(x=>x.id===g.dataset.pull);t.sprint=S.cur;t.status='todo';render()}
  else if(g.dataset.ins){const ta=$('#'+g.dataset.ins);ta.value+=(ta.value&&!ta.value.endsWith('\n')?'\n':'')+'- '+g.dataset.text+'\n';ta.dispatchEvent(new Event('input'))}
});
$('#sprintSel').onchange=e=>{S.cur=e.target.value;render()};

let editing=null;
function fillSelects(){
  $('#fPts').innerHTML=[1,2,3,5,8,13].map(n=>`<option>${n}</option>`).join('');
  $('#fStatus').innerHTML=COLS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
  $('#fSprint').innerHTML='<option value="">Backlog (sem sprint)</option>'+S.sprints.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
}
function openTask(id){
  fillSelects();editing=id?S.tasks.find(t=>t.id===id):null;
  const t=editing||{title:'',desc:'',prio:'media',pts:3,tag:'',status:'todo',sprint:S.cur||''};
  $('#dTaskTitle').textContent=editing?'Editar task':'Nova task';
  $('#fTitle').value=t.title;$('#fDesc').value=t.desc;$('#fPrio').value=t.prio;$('#fPts').value=t.pts;$('#fTag').value=t.tag;$('#fStatus').value=t.status;$('#fSprint').value=t.sprint;
  atts=[...(t.atts||[])];renderAtts();
  $('#delTask').style.display=editing?'':'none';
  $('#dTask').showModal();$('#fTitle').focus();
}
$('#newTask').onclick=()=>openTask();
$('#cancelTask').onclick=()=>$('#dTask').close();
$('#saveTask').onclick=()=>{
  const title=$('#fTitle').value.trim();if(!title){$('#fTitle').focus();return}
  const t=editing||{id:uid(),created:today(),done_at:null};
  Object.assign(t,{title,desc:$('#fDesc').value,prio:$('#fPrio').value,pts:+$('#fPts').value,tag:$('#fTag').value.trim(),sprint:$('#fSprint').value,atts:[...atts]});
  setStatus(t,$('#fStatus').value);
  if(!editing)S.tasks.push(t);
  $('#dTask').close();render();
};
$('#delTask').onclick=()=>{if(editing&&confirm('Excluir esta task?')){S.tasks=S.tasks.filter(t=>t!==editing);$('#dTask').close();render()}};

$('#newSprint').onclick=()=>{
  const n=S.sprints.length+1;$('#sName').value='Sprint '+n;$('#sGoal').value='';$('#sStart').value=today();$('#sEnd').value=addDays(today(),13);$('#dSprint').showModal();
};
$('#cancelSprint').onclick=()=>$('#dSprint').close();
$('#saveSprint').onclick=()=>{
  const name=$('#sName').value.trim();if(!name)return;
  const s={id:uid(),name,goal:$('#sGoal').value.trim(),start:$('#sStart').value,end:$('#sEnd').value,closed:false};
  S.sprints.push(s);S.cur=s.id;S.view='board';$('#dSprint').close();render();
};
function closeSprint(){
  const open=curTasks().filter(t=>t.status!=='done');
  if(!confirm(open.length?`Encerrar a sprint? ${open.length} task(s) não concluída(s) voltam para o backlog.`:'Encerrar a sprint?'))return;
  open.forEach(t=>{t.sprint='';t.status='todo'});
  sprint(S.cur).closed=true;render();
}
/* ---- Anexos ---- */
let atts=[];
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function renderAtts(){
  $('#attList').innerHTML=atts.map((a,i)=>{
    const img=(a.type||'').startsWith('image/');
    return `<div class="att">${img?`<img src="${esc(a.url)}" alt="${esc(a.name)}" data-zoom="${i}">`:'<span class="ic">📄</span>'}<div class="nm"><a href="${esc(a.url)}" download="${esc(a.name)}" target="_blank" rel="noopener">${esc(a.name)}</a><div class="muted">${fmtSize(a.size)}</div></div><button class="mv" type="button" data-rmatt="${i}" aria-label="Remover anexo">×</button></div>`;
  }).join('')||'<div class="muted" style="font-size:13px;margin-top:6px">Nenhum anexo.</div>';
}
const readData=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function addFiles(files){
  let store=null;
  try{store=await window.claude.use('assets')}catch(e){}
  for(const f of files){
    try{
      if(f.size>20*1048576){alert(f.name+': o limite é 20 MB por arquivo.');continue}
      if(store){const r=await store.upload(f);atts.push({name:f.name,type:f.type||r.contentType,size:f.size,url:r.url})}
      else if(f.size<=800*1024){atts.push({name:f.name,type:f.type,size:f.size,url:await readData(f)})}
      else alert(f.name+': sem o armazenamento da plataforma, só cabem arquivos de até 800 KB.');
    }catch(e){alert('Não foi possível anexar '+f.name+'. Tente novamente.')}
  }
  renderAtts();
}
$('#pickFile').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const dz=$('#dropZone');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');addFiles([...e.dataTransfer.files])};
$('#dTask').addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs)}});
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-rmatt]');if(r){atts.splice(+r.dataset.rmatt,1);renderAtts();return}
  const z=e.target.closest('[data-zoom]');if(z){$('#bigImg').src=atts[+z.dataset.zoom].url;$('#dImg').showModal()}
});
$('#closeImg').onclick=()=>$('#dImg').close();

/* ---- Tema ---- */
const root=document.documentElement;
const mq=matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':mq.matches;
try{const th=localStorage.getItem('sprintbook:theme');if(th==='light'||th==='dark')root.dataset.theme=th}catch(e){}
function paintTheme(){const b=$('#themeBtn');b.textContent=isDark()?'🌙 Escuro':'☀️ Claro';b.setAttribute('aria-label','Alternar tema. Tema atual: '+(isDark()?'escuro':'claro'))}
$('#themeBtn').onclick=()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('sprintbook:theme',n)}catch(e){}paintTheme()};
mq.addEventListener('change',paintTheme);
paintTheme();
render();
</script>
</body>
